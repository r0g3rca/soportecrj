<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoporteCRJ | Centro de Ayuda D3XD</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            --primary-color: #0056b3;
            --secondary-color: #00a8e8;
            --accent-color: #ff9f1c;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --bg-light: #f4f7f6;
            --white: #ffffff;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: #333;
            line-height: 1.6;
        }

        /* --- HEADER & HERO SECTION --- */
        header {
            background: linear-gradient(135deg, #004085 0%, #0056b3 100%);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        /* Botón HOME en el header */
        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .home-link:hover { text-decoration: underline; }

        header h1 { margin: 0; font-size: 2.2rem; }
        header p { margin: 10px 0 20px; opacity: 0.9; font-size: 1.1rem; }

        /* Botones del Banner */
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-hero {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            text-align: center;
        }

        .btn-consultar {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 10px rgba(255, 159, 28, 0.4);
        }

        .btn-agendar {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.5);
        }
        
        .btn-contrato {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid white;
        }

        .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
