    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            --primary-color: #0056b3;
            --secondary-color: #00a8e8;
            --accent-color: #ff9f1c;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --bg-light: #f4f7f6;
            --text-dark: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background: var(--primary-color);
            color: var(--white);
            padding: 1.5rem 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0; opacity: 0.9; }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            display: grid;
            gap: 30px;
        }

        /* --- TARJETAS --- */
        .card {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary-color);
        }

        h2 { color: var(--primary-color); text-align: center; margin-bottom: 20px; }

        /* --- FORMULARIOS E INPUTS --- */
        .form-group { margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--secondary-color); outline: none; }

        /* --- BOTONES --- */
        .btn-submit {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover { background-color: #004494; }

        /* --- ESTILOS ESPECÍFICOS DE LA BÚSQUEDA --- */
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        #resultContainer {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none; /* Oculto por defecto */
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 8px 0;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-weight: bold; color: #666; }

        /* Colores de estado */
        .bg-success { background-color: var(--success-color); color: white; }
        .bg-danger { background-color: var(--danger-color); color: white; }
        .bg-warning { background-color: var(--warning-color); color: #333; }

        /* Footer */
        footer { text-align: center; padding: 20px; color: #777; font-size: 0.9rem; }

        @media (max-width: 600px) {
            .search-box { flex-direction: column; }
        }
    </style>
</head>

        // --- FUNCIONES DE BÚSQUEDA ---
        function buscarCliente() {
            const input = document.getElementById('searchInput').value.trim().toUpperCase();
            const container = document.getElementById('resultContainer');
            
            // Si está vacío, no hacer nada
            if(input === "") {
                alert("Por favor escribe un RIF o Nombre.");
                return;
            }

            // Buscar en la base de datos (por Nombre o RIF)
            const cliente = dbClientes.find(c => c.rif.includes(input) || c.nombre.toUpperCase().includes(input));

            if (cliente) {
                // Calcular Estatus de Fecha
                const hoy = new Date();
                const fechaVence = new Date(cliente.vencimiento);
                
                // Diferencia en días
                const diffTime = fechaVence - hoy;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

                let estadoClase = "";
                let estadoTexto = "";

                if (diffDays < 0) {
                    estadoClase = "bg-danger";
                    estadoTexto = "VENCIDO";
                } else if (diffDays <= 30) {
                    estadoClase = "bg-warning";
                    estadoTexto = "VENCE PRONTO";
                } else {
                    estadoClase = "bg-success";
                    estadoTexto = "ACTIVO";
                }

                // Mostrar HTML
                container.style.display = "block";
                container.className = estadoClase; // Pone el fondo del color
                
                // Renderizar contenido
                container.innerHTML = `
                    <div style="background: white; padding: 20px; border-radius: 5px; color: #333;">

                        </div>
                        <div class="detail-row">

                        </div>
                        <div class="detail-row">

                            <span>${cliente.tipo} - Plan Completo</span>
                        </div>
                        <div class="detail-row">

                            <span style="font-weight:bold; font-size: 1.1em;">${cliente.vencimiento}</span>
                        </div>
                        <br>
                        ${diffDays < 0 ? '<p style="color:red; font-weight:bold; text-align:center;">⚠️ Su servicio requiere renovación inmediata.</p>' : ''}
                    </div>
                `;

                container.innerHTML = `<p style="color: #c62828; text-align: center; font-weight: bold;">❌ No encontramos ningún cliente con esos datos.</p>`;
            }
        }
